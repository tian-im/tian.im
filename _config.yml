title: tian.im # name of the site
author: Tian # name of site's author
description: > # description of the site (multiple lines allowed)
  TBD

permalink: pretty
# favicon: "logo.png" # name+extension of favicon (which must be put on the root folder)

# theme: no-style-please # uncomment only for local dev without jekyll-remote-theme (do not use with remote_theme)
remote_theme: riggraz/no-style-please # if you are using GitHub Pages, change it to remote_theme: riggraz/no-style-please

theme_config:
  appearance: "auto" # can be "light", "dark" or "auto"
  back_home_text: "/" # customize text for homepage link in post layout
  date_format: "%Y-%m-%d" # customize how date is formatted
  show_description: false # show blog description in home page
  lowercase_titles: true # show titles in lowercase in lists

sass:
  style: compressed

# keep development/tooling out of the published site.
# NOTE: setting `exclude` REPLACES Jekyll's default list, so the defaults
# (Gemfile, node_modules, vendor/*) are repeated here explicitly.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - test

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-remote-theme
